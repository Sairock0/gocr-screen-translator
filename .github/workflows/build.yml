# Builds the Windows executable, the portable zip and the installer.
# - Every push / pull request: the files are available under Actions > run > Artifacts.
# - Pushing a tag like v1.5.0: a GitHub Release is created with the files attached.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean GOCR.spec

      - name: Portable zip
        run: Compress-Archive -Path dist\GOCR\* -DestinationPath dist\GOCR-portable.zip -Force

      - name: Installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: GOCR-windows
          path: |
            dist/GOCR-portable.zip
            dist/GOCR-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GOCR-portable.zip
            dist/GOCR-Setup.exe
          generate_release_notes: true
